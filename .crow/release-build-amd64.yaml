when:
  event:
    - cron
    - manual
  branch:
    - main

depends_on:
  - lint

# Foreign architectures cannot be emulated here: under qemu-aarch64 these images
# clear dnf and then fail extracting the Julia tarball, so each architecture is
# built on an agent of that architecture and merged afterwards.
# thumper is the amd64 build host.
labels:
  backend: docker
  agent: thumper

variables:
  RELEASE_MONTH:
    description: Calendar month to build as YYYY-MM, defaulting to the current UTC month.
    default: ''
  RELEASE_ENVIRONMENT:
    description: Environment ID printed by scripts/list-release-environments.sh, or all to build every environment active in the month.
    default: all
  RELEASE_REBUILD:
    description: Set to true to replace calendar tags that already exist, which a rebuild of an archived month needs.
    default: 'false'

steps:
  build-amd64-images:
    image: reg.ricochet.rs/docker.io/library/alpine:3.24
    environment:
      RICOCHET_REGISTRY_TOKEN:
        from_secret: ricochet_registry_token
      RELEASE_PLATFORM: linux/amd64
    commands:
      - apk add -q --no-cache bash docker-cli docker-cli-buildx jq yq
      - export DOCKER_CONFIG="$${CI_WORKSPACE}/.release-docker"
      - mkdir -p "$${DOCKER_CONFIG}"
      - printf '%s' "$${RICOCHET_REGISTRY_TOKEN}" | docker login reg.ricochet.rs --username 'robot$ricochet' --password-stdin
      - release_month="$${RELEASE_MONTH:-$$(date -u +%Y-%m)}"
      - |
        if [ "$${RELEASE_ENVIRONMENT:-all}" = all ]; then
          scripts/build-release-images.sh "$${release_month}"
        else
          scripts/build-release-images.sh "$${release_month}" "$${RELEASE_ENVIRONMENT}"
        fi
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
