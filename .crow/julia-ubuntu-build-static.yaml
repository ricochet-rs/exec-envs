when:
  event:
    - push
    - pull_request
depends_on:
  - lint
# autoscaled agents don't have buildx emulators installed
labels:
  agent: thumper
variables:
  - &repo 'reg.ricochet.rs/exec-envs/${name},docker.io/ricochetrs/${name}'
matrix:
  include:
    ### noble
    - name: julia-ubuntu
      JULIA_VERSION: '1.12' # renovate: julia-current
      OS_VERSION: noble
      requests_cpu: 1000m
      requests_memory: 500Mi
      limits_cpu: 2000m
      limits_memory: 800Mi
    - name: julia-ubuntu
      JULIA_VERSION: '1.10'
      OS_VERSION: noble
      requests_cpu: 1000m
      requests_memory: 500Mi
      limits_cpu: 2000m
      limits_memory: 800Mi
steps:
  Build image (branch):
    when:
      - event: push
        branch:
          - renovate/*
    image: codefloe.com/crow-plugins/docker-buildx:2.5.0
    settings:
      mtu: 1350
      platforms: linux/amd64,linux/arm64
      repo: *repo
      dockerfile: ${name}/Containerfile
      tags: '${JULIA_VERSION}-${OS_VERSION}'
      dry_run: true
      provenance: true
      sbom: true
      build_args_from_env:
        - JULIA_VERSION
        - OS_VERSION
  Build image (PR):
    when:
      path:
        - .crow/julia-ubuntu-build-static.yaml
        - ${name}/Containerfile
      event: pull_request
    image: codefloe.com/crow-plugins/docker-buildx:2.5.0
    settings:
      mtu: 1350
      platforms: linux/amd64,linux/arm64
      repo: *repo
      dockerfile: ${name}/Containerfile
      tags: '${JULIA_VERSION}-${OS_VERSION}'
      dry_run: true
      provenance: true
      sbom: true
      build_args_from_env:
        - JULIA_VERSION
        - OS_VERSION
