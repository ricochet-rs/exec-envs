when:
  - event: [pull_request, tag, cron, manual]
  - event: push
    branch:
      - ${CI_REPO_DEFAULT_BRANCH}
      - renovate/*

labels:
  agent: thumper

steps:
  lint-dockerfile:
    image: reg.ricochet.rs/docker.io/hadolint/hadolint:v2.15.1-alpine
    depends_on: []
    commands:
      - find . -type f \( -iname \*.containerfile -or -iname Containerfile \) | sort | xargs hadolint

  lint-markdown:
    image: reg.ricochet.rs/docker.io/davidanson/markdownlint-cli2:v0.23.2
    depends_on: []
    commands:
      - 'markdownlint-cli2 --ignore-pattern LICENSE.md "*.{md,markdown}"'
    when:
      path: '*.{md,markdown}'

  prettier:
    image: reg.ricochet.rs/docker.io/woodpeckerci/plugin-prettier:1.4.1
    depends_on: []
    settings:
      version: 3.2.5

  lint-editorconfig:
    depends_on: []
    image: reg.ricochet.rs/docker.io/mstruebing/editorconfig-checker:v3.11.1
    when:
      event: pull_request

  lint-yaml:
    image: reg.ricochet.rs/docker.io/pipelinecomponents/yamllint:0.35.13
    depends_on: []
    commands:
      - yamllint .
    when:
      path: '*.{yml,yaml}'
