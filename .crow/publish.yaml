      OS_VERSION: '26.04'
    - name: 'r-alma'
      release_suffix: '4.5.3-9'
      release_from: '0000-01'
      release_through: '9999-12'
      R_VERSION: '4.5'
      JULIA_VERSION: 'unused'
      OS_VERSION: '9'
    - name: 'r-alma'
      release_suffix: '4.4.3-9'
      release_from: '0000-01'
      release_through: '9999-12'
      R_VERSION: '4.4'
