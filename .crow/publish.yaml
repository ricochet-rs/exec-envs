# Generated by scripts/render-release-workflows.sh from release/environments.
# Run `just render-release-workflows` after changing a build matrix; check-releases.sh fails on drift.
when:
  event:
    - manual
  branch:
    - main

depends_on:
  - merge-amd64-arm64
  - merge-amd64

labels:
  backend: docker

variables:
  RELEASE_MONTH:
    description: Calendar month as YYYY-MM. Crow cron cannot pass a variable or expose a date, so every release states it.
    required: true
  RELEASE_REBUILD:
    description: Set to true to replace existing calendar tags during an archived release rebuild.
    default: 'false'

matrix:
  include:
    - name: 'julia-alma'
      release_suffix: '9'
      release_from: '2026-08'
      release_through: '9999-12'
    - name: 'julia-alpine'
      release_suffix: '3.24'
      release_from: '2026-08'
      release_through: '9999-12'
    - name: 'julia-alpine'
      release_suffix: '3.23'
      release_from: '2026-08'
      release_through: '9999-12'
    - name: 'julia-ubuntu'
      release_suffix: 'resolute'
      release_from: '2026-08'
      release_through: '9999-12'
    - name: 'julia-ubuntu'
      release_suffix: 'noble'
      release_from: '2026-08'
      release_through: '9999-12'
    - name: 'python-alma'
      release_suffix: '10'
      release_from: '0000-01'
      release_through: '9999-12'
    - name: 'python-alma'
      release_suffix: '9'
      release_from: '2026-08'
      release_through: '9999-12'
    - name: 'python-ubuntu'
      release_suffix: 'noble'
      release_from: '0000-01'
      release_through: '9999-12'
    - name: 'python-ubuntu'
      release_suffix: 'resolute'
      release_from: '0000-01'
      release_through: '9999-12'
    - name: 'r-alma'
      release_suffix: '10'
      release_from: '2026-08'
      release_through: '9999-12'
    - name: 'r-alma'
      release_suffix: '9'
      release_from: '0000-01'
      release_through: '9999-12'
    - name: 'r-alpine'
      release_suffix: '3.24'
      release_from: '2026-08'
      release_through: '9999-12'
    - name: 'r-alpine'
      release_suffix: '3.23'
      release_from: '0000-01'
      release_through: '9999-12'
    - name: 'r-ubuntu'
      release_suffix: 'resolute'
      release_from: '2026-08'
      release_through: '9999-12'
    - name: 'r-ubuntu'
      release_suffix: 'noble'
      release_from: '0000-01'
      release_through: '9999-12'

steps:
  publish-manifest:
    when:
      evaluate: 'RELEASE_MONTH >= release_from && RELEASE_MONTH <= release_through'
    image: codefloe.com/crow-plugins/docker-buildx:2.5.0
    settings:
      manifest: true
      repo: docker.io/ricochetrs/${name}
      tags: ${RELEASE_MONTH}-${release_suffix}
      manifest_sources:
        - reg.ricochet.rs/exec-envs/${name}:${RELEASE_MONTH}-${release_suffix}
      logins:
        - registry: https://reg.ricochet.rs
          username: 'robot$ricochet'
          password:
            from_secret: ricochet_registry_token
        - registry: https://index.docker.io/v1/
          username: ricochetbot
          password:
            from_secret: ricochet_dockerhub_token
