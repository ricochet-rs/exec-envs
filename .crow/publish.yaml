# Generated by scripts/render-release-workflows.sh from release/environments.
# Run `just render-release-workflows` after changing a build matrix; check-releases.sh fails on drift.
when:
  event:
    - manual
  branch:
    - main

depends_on:
  - merge-amd64-arm64
  - merge-amd64

labels:
  backend: docker

variables:
  RELEASE_MONTH:
    description: Calendar month as YYYY-MM. Crow cron cannot pass a variable or expose a date, so every release states it.
    required: true

matrix:
  include:
    - name: 'julia-alma'
      release_suffix: '1.12-9'
      release_from: '0000-01'
      release_through: '9999-12'
      R_VERSION: 'unused'
      JULIA_VERSION: '1.12'
      OS_VERSION: '9'
    - name: 'julia-alma'
      release_suffix: '1.10-9'
      release_from: '0000-01'
      release_through: '9999-12'
      R_VERSION: 'unused'
      JULIA_VERSION: '1.10'
      OS_VERSION: '9'
    - name: 'julia-alpine'
      release_suffix: '1.12-3.24'
      release_from: '2026-08'
      release_through: '9999-12'
      R_VERSION: 'unused'
      JULIA_VERSION: '1.12'
      OS_VERSION: '3.24'
    - name: 'julia-alpine'
      release_suffix: '1.10-3.24'
      release_from: '2026-08'
      release_through: '9999-12'
      R_VERSION: 'unused'
      JULIA_VERSION: '1.10'
      OS_VERSION: '3.24'
    - name: 'julia-alpine'
      release_suffix: '1.12-3.23'
