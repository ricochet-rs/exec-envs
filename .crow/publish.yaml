    - name: 'julia-alpine'
      release_suffix: '1.10-3.23'
      release_from: '0000-01'
      release_through: '9999-12'
      R_VERSION: 'unused'
      JULIA_VERSION: '1.10'
      OS_VERSION: '3.23'
    - name: 'julia-ubuntu'
      release_suffix: '1.12-noble'
      release_from: '0000-01'
      release_through: '9999-12'
      R_VERSION: 'unused'
      JULIA_VERSION: '1.12'
      OS_VERSION: 'noble'
    - name: 'julia-ubuntu'
      release_suffix: '1.10-noble'
      release_from: '0000-01'
      release_through: '9999-12'
