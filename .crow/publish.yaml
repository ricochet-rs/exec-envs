steps:
  publish-manifest:
    when:
      evaluate: 'RELEASE_MONTH >= release_from && RELEASE_MONTH <= release_through'
    image: codefloe.com/crow-plugins/docker-buildx:2.5.0
    settings:
      manifest: true
      repo: docker.io/ricochetrs/${name}
      tags: ${RELEASE_MONTH}-${release_suffix}
      manifest_sources:
        - reg.ricochet.rs/exec-envs/${name}:${RELEASE_MONTH}-${release_suffix}
      logins:
        - registry: https://reg.ricochet.rs
          username: 'robot$ricochet'
          password:
            from_secret: ricochet_registry_token
        - registry: https://index.docker.io/v1/
          username: ricochetbot
          password:
            from_secret: ricochet_dockerhub_token
