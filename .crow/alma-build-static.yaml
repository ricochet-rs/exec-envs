when:
  event:
    - push
    - pull_request
depends_on:
  - lint
# autoscaled agents don't have buildx emulators installed
labels:
  agent: thumper
variables:
  - &repo 'reg.ricochet.rs/exec-envs/${name},docker.io/ricochetrs/${name}'
matrix:
  include:
    ### 9
    - name: r-alma
      R_VERSION: 4.5
      OS_VERSION: 9
      requests_cpu: 1000m
      requests_memory: 500Mi
      limits_cpu: 2000m
      limits_memory: 800Mi
      release_suffix: 4.5.3-9
    - name: r-alma
      R_VERSION: 4.4
      OS_VERSION: 9
      requests_cpu: 1000m
      requests_memory: 500Mi
      limits_cpu: 2000m
      limits_memory: 800Mi
      release_suffix: 4.4.3-9
steps:
  Build image (branch):
    when:
      - event: push
        branch:
          - renovate/*
    image: codefloe.com/crow-plugins/docker-buildx:2.5.0
    settings:
      mtu: 1350
      platforms: linux/amd64,linux/arm64
      repo: *repo
      dockerfile: ${name}/Containerfile
      tags: ${release_suffix}
      dry_run: true
      provenance: true
      sbom: true
      build_args_from_env:
        - R_VERSION
        - OS_VERSION
  Build image (PR):
    when:
      path:
        - .crow/alma-build-static.yaml
        - ${name}/Containerfile
      event: pull_request
    image: codefloe.com/crow-plugins/docker-buildx:2.5.0
    settings:
      mtu: 1350
      platforms: linux/amd64,linux/arm64
      repo: *repo
      dockerfile: ${name}/Containerfile
      tags: ${release_suffix}
      dry_run: true
      provenance: true
      sbom: true
      build_args_from_env:
        - R_VERSION
        - OS_VERSION
