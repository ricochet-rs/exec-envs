# Generated by scripts/render-r-sysreqs-workflows.sh from r/sysreqs/config.json.
when:
  event: pull_request
  path:
    include:
      - 'r/**'
      - 'scripts/*r-sysreqs*'
      - '.crow/r-sysreqs-build-*.yaml'

depends_on:
  - lint

labels:
  backend: docker
  platform: linux/arm64

matrix:
  include:
    - target: 'ubuntu-noble'
      containerfile: 'r/ubuntu/Containerfile'
      OS_VERSION: 'noble'
    - target: 'ubuntu-resolute'
      containerfile: 'r/ubuntu/Containerfile'
      OS_VERSION: 'resolute'
    - target: 'alma-9'
      containerfile: 'r/alma/Containerfile'
      OS_VERSION: '9'
    - target: 'alma-10'
      containerfile: 'r/alma/Containerfile'
      OS_VERSION: '10'
    - target: 'alpine-3.23'
      containerfile: 'r/alpine/Containerfile'
      OS_VERSION: '3.23'
    - target: 'alpine-3.24'
      containerfile: 'r/alpine/Containerfile'
      OS_VERSION: '3.24'

steps:
  build-image:
    image: codefloe.com/crow-plugins/docker-buildx:2.5.0
    settings:
      mtu: 1350
      platforms: linux/arm64
      repo: ricochetrs/r-sysreqs-validation
      tags: ${target}-arm64
      dockerfile: ${containerfile}
      dry_run: true
      build_args_from_env:
        - OS_VERSION
