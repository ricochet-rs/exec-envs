# Generated by scripts/render-release-workflows.sh from release/environments.
# Run `just render-release-workflows` after changing a build matrix; check-releases.sh fails on drift.
when:
  event:
    - manual
  branch:
    - main

depends_on:
  - lint

# backend keeps this off a local-backend agent, which execs the image field as a
# command. platform keeps an arm64 build off an amd64 agent, where it would fall back
# to emulation these images cannot survive.
labels:
  backend: docker
  platform: linux/arm64

variables:
  RELEASE_MONTH:
    description: Calendar month as YYYY-MM. Crow cron cannot pass a variable or expose a date, so every release states it.
    required: true
  RELEASE_REBUILD:
    description: Set to true to replace existing calendar tags during an archived release rebuild.
    default: 'false'

matrix:
  include:
    - name: 'julia-alma'
      release_suffix: '9'
      release_from: '2026-09'
      release_through: '9999-12'
      containerfile: 'julia/alma/Containerfile'
      R_VERSION: 'unused'
      JULIA_VERSION: 'unused'
      OS_VERSION: '9'
    - name: 'julia-ubuntu'
      release_suffix: 'resolute'
      release_from: '2026-09'
      release_through: '9999-12'
      containerfile: 'julia/ubuntu/Containerfile'
      R_VERSION: 'unused'
      JULIA_VERSION: 'unused'
      OS_VERSION: 'resolute'
    - name: 'julia-ubuntu'
      release_suffix: 'noble'
      release_from: '2026-09'
      release_through: '9999-12'
      containerfile: 'julia/ubuntu/Containerfile'
      R_VERSION: 'unused'
      JULIA_VERSION: 'unused'
      OS_VERSION: 'noble'
    - name: 'python-alma'
      release_suffix: '10'
      release_from: '0000-01'
      release_through: '9999-12'
      containerfile: 'python/alma/Containerfile'
      R_VERSION: 'unused'
      JULIA_VERSION: 'unused'
      OS_VERSION: '10'
    - name: 'python-alma'
      release_suffix: '9'
      release_from: '2026-09'
      release_through: '9999-12'
      containerfile: 'python/alma/Containerfile'
      R_VERSION: 'unused'
      JULIA_VERSION: 'unused'
      OS_VERSION: '9'
    - name: 'python-ubuntu'
      release_suffix: 'noble'
      release_from: '0000-01'
      release_through: '9999-12'
      containerfile: 'python/ubuntu/Containerfile'
      R_VERSION: 'unused'
      JULIA_VERSION: 'unused'
      OS_VERSION: 'noble'
    - name: 'python-ubuntu'
      release_suffix: 'resolute'
      release_from: '0000-01'
      release_through: '9999-12'
      containerfile: 'python/ubuntu/Containerfile'
      R_VERSION: 'unused'
      JULIA_VERSION: 'unused'
      OS_VERSION: 'resolute'
    - name: 'r-alma'
      release_suffix: '10'
      release_from: '2026-09'
      release_through: '9999-12'
      containerfile: 'r/alma/Containerfile'
      R_VERSION: 'unused'
      JULIA_VERSION: 'unused'
      OS_VERSION: '10'
    - name: 'r-alma'
      release_suffix: '9'
      release_from: '0000-01'
      release_through: '9999-12'
      containerfile: 'r/alma/Containerfile'
      R_VERSION: 'unused'
      JULIA_VERSION: 'unused'
      OS_VERSION: '9'
    - name: 'r-alpine'
      release_suffix: '3.24'
      release_from: '2026-08'
      release_through: '9999-12'
      containerfile: 'r/alpine/Containerfile'
      R_VERSION: 'unused'
      JULIA_VERSION: 'unused'
      OS_VERSION: '3.24'
    - name: 'r-alpine'
      release_suffix: '3.23'
      release_from: '0000-01'
      release_through: '9999-12'
      containerfile: 'r/alpine/Containerfile'
      R_VERSION: 'unused'
      JULIA_VERSION: 'unused'
      OS_VERSION: '3.23'
    - name: 'r-ubuntu'
      release_suffix: 'resolute'
      release_from: '2026-09'
      release_through: '9999-12'
      containerfile: 'r/ubuntu/Containerfile'
      R_VERSION: 'unused'
      JULIA_VERSION: 'unused'
      OS_VERSION: 'resolute'
    - name: 'r-ubuntu'
      release_suffix: 'noble'
      release_from: '0000-01'
      release_through: '9999-12'
      containerfile: 'r/ubuntu/Containerfile'
      R_VERSION: 'unused'
      JULIA_VERSION: 'unused'
      OS_VERSION: 'noble'

steps:
  build-image:
    when:
      evaluate: 'RELEASE_MONTH >= release_from && RELEASE_MONTH <= release_through'
    image: codefloe.com/crow-plugins/docker-buildx:2.5.0
    settings:
      mtu: 1350
      platforms: linux/arm64
      repo: reg.ricochet.rs/exec-envs/${name}
      tags: ${RELEASE_MONTH}-${release_suffix}-arm64
      dockerfile: ${containerfile}
      provenance: true
      sbom: true
      build_args_from_env:
        - R_VERSION
        - JULIA_VERSION
        - OS_VERSION
      logins:
        - registry: https://reg.ricochet.rs
          username: 'robot$ricochet'
          password:
            from_secret: ricochet_registry_token
