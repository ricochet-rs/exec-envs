# Generated by scripts/render-release-workflows.sh from release/environments.
# Run `just render-release-workflows` after changing a build matrix; check-releases.sh fails on drift.
when:
  event:
    - manual
  branch:
    - main

depends_on:
  - build-r-alpine-amd64
  - build-r-alpine-arm64

# Composing an index reads registry metadata only, so it needs no builder.
labels:
  backend: docker

variables:
  RELEASE_MONTH:
    description: Calendar month to compose as YYYY-MM. Crow cron cannot supply it, so every release run states it.
    required: true

matrix:
  include:
    - release_suffix: '4.5.3-3.24'
      release_from: '2026-08'
      release_through: '9999-12'
      R_VERSION: '4.5'
      OS_VERSION: '3.24'
    - release_suffix: '4.4.3-3.24'
      release_from: '2026-08'
      release_through: '9999-12'
      R_VERSION: '4.4'
      OS_VERSION: '3.24'
    - release_suffix: '4.5.3-3.23'
      release_from: '0000-01'
      release_through: '9999-12'
      R_VERSION: '4.5'
      OS_VERSION: '3.23'
    - release_suffix: '4.4.3-3.23'
      release_from: '0000-01'
      release_through: '9999-12'
      R_VERSION: '4.4'
      OS_VERSION: '3.23'

steps:
  merge-manifest:
    when:
      evaluate: 'RELEASE_MONTH >= release_from && RELEASE_MONTH <= release_through'
    image: codefloe.com/crow-plugins/docker-buildx:2.5.0
    settings:
      manifest: true
      repo: reg.ricochet.rs/exec-envs/r-alpine
      tags: ${RELEASE_MONTH}-${release_suffix}
      manifest_sources:
        - reg.ricochet.rs/exec-envs/r-alpine:${RELEASE_MONTH}-${release_suffix}-amd64
        - reg.ricochet.rs/exec-envs/r-alpine:${RELEASE_MONTH}-${release_suffix}-arm64
      logins:
        - registry: https://reg.ricochet.rs
          username: 'robot$ricochet'
          password:
            from_secret: ricochet_registry_token
