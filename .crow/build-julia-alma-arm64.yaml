# Generated by scripts/render-release-workflows.sh from release/environments.
# Run `just render-release-workflows` after changing a build matrix; check-releases.sh fails on drift.
when:
  event:
    - manual
  branch:
    - main

depends_on:
  - lint

# backend selects a Docker agent, because a local-backend agent execs the image
# field as a command. platform keeps an arm64 build off an amd64 agent, where it
# would fall back to emulation these images cannot survive.
labels:
  backend: docker
  platform: linux/arm64

variables:
  RELEASE_MONTH:
    description: Calendar month to build as YYYY-MM. Crow cron cannot supply it, so every release run states it.
    required: true

matrix:
  include:
    - release_suffix: '1.12-9'
      release_from: '0000-01'
      release_through: '9999-12'
      JULIA_VERSION: '1.12'
      OS_VERSION: '9'
    - release_suffix: '1.10-9'
      release_from: '0000-01'
      release_through: '9999-12'
      JULIA_VERSION: '1.10'
      OS_VERSION: '9'

steps:
  build-image:
    when:
      evaluate: 'RELEASE_MONTH >= release_from && RELEASE_MONTH <= release_through'
    image: codefloe.com/crow-plugins/docker-buildx:2.5.0
    settings:
      mtu: 1350
      platforms: linux/arm64
      repo: reg.ricochet.rs/exec-envs/julia-alma
      tags: ${RELEASE_MONTH}-${release_suffix}-arm64
      dockerfile: julia-alma/Containerfile
      provenance: true
      sbom: true
      build_args_from_env:
        - JULIA_VERSION
        - OS_VERSION
      logins:
        - registry: https://reg.ricochet.rs
          username: 'robot$ricochet'
          password:
            from_secret: ricochet_registry_token
