# Generated by scripts/render-release-workflows.sh from release/environments.
# Run `just render-release-workflows` after changing a build matrix; check-releases.sh fails on drift.
when:
  event:
    - manual
  branch:
    - main
  evaluate: "RELEASE_METADATA_ONLY != 'true'"

depends_on:
  - build-amd64

# Composing an index reads registry metadata only, so it needs no builder.
labels:
  backend: docker

variables:
  RELEASE_MONTH:
    description: Calendar month as YYYY-MM. Crow cron cannot pass a variable or expose a date, so every release states it.
    required: true
  RELEASE_REBUILD:
    description: Set to true to replace existing calendar tags during an archived release rebuild.
    options:
      - 'false'
      - 'true'
    default: 'false'
  RELEASE_METADATA_ONLY:
    description: Set to true to archive images that are already published without building or promoting them.
    options:
      - 'false'
      - 'true'
    default: 'false'

matrix:
  include:
    - name: 'julia-alpine'
      release_suffix: '3.24'
      release_from: '2026-08'
      release_through: '9999-12'
    - name: 'julia-alpine'
      release_suffix: '3.23'
      release_from: '2026-08'
      release_through: '9999-12'

steps:
  merge-manifest:
    when:
      evaluate: 'RELEASE_MONTH >= release_from && RELEASE_MONTH <= release_through'
    image: codefloe.com/crow-plugins/docker-buildx:2.5.0
    settings:
      manifest: true
      repo: reg.ricochet.rs/exec-envs/${name}
      tags: ${RELEASE_MONTH}-${release_suffix}
      manifest_sources:
        - reg.ricochet.rs/exec-envs/${name}:${RELEASE_MONTH}-${release_suffix}-amd64
      logins:
        - registry: https://reg.ricochet.rs
          username: 'robot$ricochet'
          password:
            from_secret: ricochet_registry_token
