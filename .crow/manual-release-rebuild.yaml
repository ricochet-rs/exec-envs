when:
  event:
    - manual
  branch:
    - main

depends_on:
  - lint
  - publish

# The rebuild probes need the Docker daemon to run each image and read its versions.
labels:
  backend: docker
  agent: thumper

variables:
  RELEASE_MONTH:
    description: Archived month to rebuild as YYYY-MM. A month that is not archived is refused.
    required: true
  RELEASE_REBUILD:
    description: Must be true to rebuild. The build and merge workflows read the same input, so one value drives the whole pipeline.
    default: 'false'

steps:
  rebuild-and-scan-release:
    image: reg.ricochet.rs/docker.io/library/alpine:3.24
    environment:
      RICOCHET_REGISTRY_TOKEN:
        from_secret: ricochet_registry_token
    commands:
      - apk add -q --no-cache bash docker-cli docker-cli-buildx jq yq
      - export DOCKER_CONFIG="$${CI_WORKSPACE}/.release-docker"
      - mkdir -p "$${DOCKER_CONFIG}"
      - printf '%s' "$${RICOCHET_REGISTRY_TOKEN}" | docker login reg.ricochet.rs --username 'robot$ricochet' --password-stdin
      # Guarding the shared input rather than pinning it here: pinning would hide an
      # operator who left it false, and the archive would then record the very images
      # this run exists to replace.
      - |
        if [ "$${RELEASE_REBUILD:-false}" != true ]; then
          echo "Set RELEASE_REBUILD=true so the build, merge and publish workflows replace the archived images" >&2
          exit 1
        fi
      - RELEASE_CLEANUP_IMAGES=true scripts/create-release.sh "$${RELEASE_MONTH}"
      - scripts/scan-release.sh "$${RELEASE_MONTH}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  format-rebuilt-release:
    depends_on:
      - rebuild-and-scan-release
    image: reg.ricochet.rs/docker.io/oven/bun:1.4.0-alpine
    commands:
      - apk add -q --no-cache bash
      - scripts/format-release.sh "$${RELEASE_MONTH}"

  publish-and-archive-rebuild:
    depends_on:
      - format-rebuilt-release
    image: reg.ricochet.rs/docker.io/library/alpine:3.24
    environment:
      DOCKERHUB_TOKEN:
        from_secret: ricochet_dockerhub_token
      GH_TOKEN:
        from_secret: exec_envs_release_token
    commands:
      - apk add -q --no-cache bash docker-cli docker-cli-buildx github-cli git jq yq
      - export DOCKER_CONFIG="$${CI_WORKSPACE}/.release-docker"
      - printf '%s' "$${DOCKERHUB_TOKEN}" | docker login docker.io --username ricochetbot --password-stdin
      - scripts/check-releases.sh --remote
      - git add README.md r/*/README.md python/*/README.md julia/*/README.md "releases/$${RELEASE_MONTH}"
      - |
        if git diff --cached --quiet; then
          echo "Rebuild of $${RELEASE_MONTH} produced the same digests"
          exit 0
        fi
      - git config user.name ricochet-bot
      - git config user.email droid@ricochet.rs
      - 'git commit -m "chore(releases): rebuild $${RELEASE_MONTH} environments"'
      - gh auth setup-git
      - 'git push origin "HEAD:$${CI_REPO_DEFAULT_BRANCH}"'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
