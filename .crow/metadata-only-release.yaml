when:
  event:
    - manual
  branch:
    - main
  evaluate: "RELEASE_METADATA_ONLY == 'true'"

depends_on:
  - lint

# Inventory probes run each image, so this needs a Docker daemon.
labels:
  backend: docker
  agent: thumper

variables:
  RELEASE_MONTH:
    description: Published month to archive as YYYY-MM.
    required: true
  RELEASE_METADATA_ONLY:
    description: Must be true to archive images without building or promoting them.
    options:
      - 'false'
      - 'true'
    default: 'false'

steps:
  create-and-prepare-release:
    image: reg.ricochet.rs/docker.io/library/alpine:3.24
    environment:
      RICOCHET_REGISTRY_TOKEN:
        from_secret: ricochet_registry_token
    commands:
      - apk add -q --no-cache bash docker-cli docker-cli-buildx jq yq
      - export DOCKER_CONFIG="$${CI_WORKSPACE}/.release-docker"
      - mkdir -p "$${DOCKER_CONFIG}"
      - printf '%s' "$${RICOCHET_REGISTRY_TOKEN}" | docker login reg.ricochet.rs --username 'robot$ricochet' --password-stdin
      - RELEASE_CLEANUP_IMAGES=true scripts/re-release.sh "$${RELEASE_MONTH}"
      - scripts/prepare-next-release.sh "$${RELEASE_MONTH}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  format-release:
    depends_on:
      - create-and-prepare-release
    image: reg.ricochet.rs/docker.io/oven/bun:1.4.0-alpine
    commands:
      - apk add -q --no-cache bash
      - scripts/format-release.sh "$${RELEASE_MONTH}"

  verify-and-archive-release:
    depends_on:
      - format-release
    image: reg.ricochet.rs/docker.io/library/alpine:3.24
    environment:
      DOCKERHUB_TOKEN:
        from_secret: ricochet_dockerhub_token
      GH_TOKEN:
        from_secret: exec_envs_release_token
    commands:
      - apk add -q --no-cache bash docker-cli docker-cli-buildx github-cli git jq yq
      - export DOCKER_CONFIG="$${CI_WORKSPACE}/.release-docker"
      - printf '%s' "$${DOCKERHUB_TOKEN}" | docker login docker.io --username ricochetbot --password-stdin
      - scripts/check-releases.sh --remote
      - |
        git add README.md r/*/README.md python/*/README.md julia/*/README.md "releases/$${RELEASE_MONTH}"
        for matrix_file in release/environments/r-alpine.yaml release/environments/julia-alpine.yaml; do
          git add "$${matrix_file}" "$(yq -r '.containerfile' "$${matrix_file}")"
        done
      - |
        if git diff --cached --quiet; then
          echo "Release $${RELEASE_MONTH} is already archived"
        else
          git config user.name ricochet-bot
          git config user.email droid@ricochet.rs
          git commit -m "chore(releases): archive $${RELEASE_MONTH} environments"
          gh auth setup-git
          git push origin "HEAD:$${CI_REPO_DEFAULT_BRANCH}"
        fi
      - scripts/publish-release-notes.sh
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
