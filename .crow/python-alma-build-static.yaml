when:
  event:
    - push
    - cron
    - manual
    - pull_request

depends_on:
  - lint

# autoscaled agents don't have buildx emulators installed
labels:
  agent: thumper

variables:
  - logins: &logins
      - registry: https://reg.ricochet.rs
        username: robot$ricochet
        password:
          from_secret: ricochet_registry_token
      - registry: https://index.docker.io
        username: ricochetbot
        password:
          from_secret: ricochet_dockerhub_token
  - &repo 'reg.ricochet.rs/exec-envs/${name},docker.io/ricochetrs/${name}'

matrix:
  include:
    - name: python-alma
      OS_VERSION: 10
      tag_additional: 'latest,10'
      requests_cpu: 1000m
      requests_memory: 500Mi
      limits_cpu: 2000m
      limits_memory: 800Mi

steps:
  'Build and publish image (cron)':
    when:
      event: cron
    image: codefloe.com/crow-plugins/docker-buildx:2.3.2
    settings:
      mtu: 1350
      platforms: linux/amd64,linux/arm64
      logins: *logins
      repo: *repo
      dockerfile: ${name}/Containerfile
      tags: ${tag_additional}
      provenance: true
      sbom: true
      build_args_from_env:
        - OS_VERSION

  'Build and publish image (branch)':
    when:
      - event: push
        branch:
          - renovate/*
    image: codefloe.com/crow-plugins/docker-buildx:2.3.2
    settings:
      mtu: 1350
      platforms: linux/amd64,linux/arm64
      logins: *logins
      repo: *repo
      dockerfile: ${name}/Containerfile
      tags: ${tag_additional}
      dry_run: true
      provenance: true
      sbom: true
      build_args_from_env:
        - OS_VERSION

  'Build and publish image (PR)':
    when:
      path:
        - ${name}/Containerfile
      event: pull_request
    image: codefloe.com/crow-plugins/docker-buildx:2.3.2
    settings:
      mtu: 1350
      platforms: linux/amd64,linux/arm64
      logins: *logins
      repo: *repo
      dockerfile: ${name}/Containerfile
      tags: ${tag_additional}
      dry_run: true
      provenance: true
      sbom: true
      build_args_from_env:
        - OS_VERSION
