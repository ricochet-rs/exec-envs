apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: ricochet-preview-exec-env-values
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: ricochet-preview-exec-envs
    app.kubernetes.io/part-of: ricochet-previews
    reconcile.fluxcd.io/watch: Enabled
