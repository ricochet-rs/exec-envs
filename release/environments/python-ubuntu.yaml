# Build matrix for the python-ubuntu exec environment.
# Each entry becomes one immutable calendar tag in every monthly release it is active for.
image: python-ubuntu
containerfile: python/ubuntu/Containerfile
platforms: linux/amd64,linux/arm64
environments:
  - OS_VERSION: noble
    release_suffix: noble
  - OS_VERSION: 26.04
    release_suffix: '26.04'
