# Build matrix for the julia-alpine exec environment.
# Each entry becomes one immutable calendar tag in every monthly release it is active for.
image: julia-alpine
containerfile: julia/alpine/Containerfile
platforms: linux/amd64
environments:
  ### 3.24
  - OS_VERSION: 3.24
    release_suffix: '3.24'
    release_from: '2026-08'
  ### 3.23
  - OS_VERSION: 3.23
    release_suffix: '3.23'
    release_from: '2026-08'
