# Build matrix for the r-alpine exec environment.
# Each entry becomes one immutable calendar tag in every monthly release it is active for.
image: r-alpine
platforms: linux/amd64,linux/arm64
environments:
  ### 3.24
  - OS_VERSION: 3.24
    release_from: '2026-08'
    release_suffix: '3.24'
  ### 3.23
  - OS_VERSION: 3.23
    release_suffix: '3.23'
