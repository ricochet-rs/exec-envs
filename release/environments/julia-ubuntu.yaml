# Build matrix for the julia-ubuntu exec environment.
# Each entry becomes one immutable calendar tag in every monthly release it is active for.
image: julia-ubuntu
containerfile: julia/ubuntu/Containerfile
platforms: linux/amd64,linux/arm64
environments:
  ### resolute
  - OS_VERSION: resolute
    release_suffix: resolute
    release_from: '2026-08'
  ### noble
  - OS_VERSION: noble
    release_suffix: noble
    release_from: '2026-08'
