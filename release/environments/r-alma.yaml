# Build matrix for the r-alma exec environment.
# Each entry becomes one immutable calendar tag in every monthly release it is active for.
image: r-alma
containerfile: r/alma/Containerfile
platforms: linux/amd64,linux/arm64
environments:
  ### 10
  - OS_VERSION: 10
    release_suffix: '10'
    release_from: '2026-09'
  ### 9
  - OS_VERSION: 9
    release_suffix: '9'
